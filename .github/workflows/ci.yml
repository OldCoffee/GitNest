name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Playwright main-path E2E
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  rust-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  fixture-tiny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate tiny perf fixture
        run: |
          OUT="$RUNNER_TEMP/gitnest-fixture-tiny" bash scripts/gen-perf-repo.sh tiny
          test -d "$RUNNER_TEMP/gitnest-fixture-tiny/.git"
          rm -rf "$RUNNER_TEMP/gitnest-fixture-tiny"
